# Builds a Windows portable .exe whenever you push game code.
name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
      - Update-4
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Build portable EXE
        working-directory: desktop
        run: npm run dist
        env:
          # Skip code signing (no cert needed for private / testing builds)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RiftHorizon-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

# Builds Windows EXE + Android APK and publishes both on one GitHub Release.
name: Build & Release

on:
  push:
    branches:
      - main
      - master
      - Update-4
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch: {}

# New push on the same branch cancels the in-progress run so rapid
# multi-file edits only produce one final build/release.
concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_VERSION: '0.4.0'

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install & build
        working-directory: desktop
        run: |
          npm install
          npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        run: |
          set -e
          ANDROID_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_ROOT/cmdline-tools"
          rm -rf "$ANDROID_ROOT/cmdline-tools/latest"
          mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install platform packages
        run: |
          set -e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Capacitor deps
        run: npm install

      - name: Stage web assets into www/
        run: |
          set -e
          rm -rf www
          mkdir -p www
          for item in index.html game.js favicon.png apple-touch-icon.png og.png lib assets; do
            if [ -e "$item" ]; then cp -a "$item" www/; fi
          done
          for f in *.js *.css *.wasm; do
            [ -f "$f" ] || continue
            case "$f" in package.json|package-lock.json) continue ;; esac
            cp -a "$f" www/ 2>/dev/null || true
          done
          test -f www/index.html

      - name: Add Android platform & sync
        run: |
          set -e
          npx cap add android
          npx cap sync android
          test -d android

      - name: Apply favicon.png as Android app icon
        run: |
          set -e
          test -f favicon.png
          # Capacitor default launcher names
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi mipmap-anydpi-v26; do
            mkdir -p "android/app/src/main/res/$d"
          done
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp favicon.png "android/app/src/main/res/$d/ic_launcher.png"
            cp favicon.png "android/app/src/main/res/$d/ic_launcher_round.png"
            cp favicon.png "android/app/src/main/res/$d/ic_launcher_foreground.png"
          done
          # Adaptive icon XML (API 26+) pointing at foreground
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          mkdir -p android/app/src/main/res/values
          if [ ! -f android/app/src/main/res/values/ic_launcher_background.xml ]; then
            cat > android/app/src/main/res/values/ic_launcher_background.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0A0C10</color>
          </resources>
          XML
          fi
          echo "Android icons applied from favicon.png"

      - name: Build debug APK
        working-directory: android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          set -e
          mkdir -p out
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" "out/RiftHorizon-${{ env.APP_VERSION }}-android-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Debounce — skip if a release was published in the last 10 minutes
        id: debounce
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Manual "Run workflow" always publishes
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Manual run — release allowed"
            exit 0
          fi
          # Latest release published_at (empty if none)
          PUBLISHED=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].published_at // empty' 2>/dev/null || true)
          if [ -z "$PUBLISHED" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No prior release — publishing"
            exit 0
          fi
          NOW=$(date -u +%s)
          THEN=$(date -u -d "$PUBLISHED" +%s)
          AGE=$(( NOW - THEN ))
          echo "Last release was ${AGE}s ago ($PUBLISHED)"
          if [ "$AGE" -lt 600 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping release (within 10 minute debounce window)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build short changelog
        if: steps.debounce.outputs.skip != 'true'
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v${{ env.APP_VERSION }}-build.${{ github.run_number }}"
          PREV=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].tag_name // empty' 2>/dev/null || true)

          {
            echo "### Changelog"
            echo ""
            if [ -n "$PREV" ] && git rev-parse "$PREV" >/dev/null 2>&1; then
              # Only commits after the last release, max 12 lines
              COUNT=$(git rev-list --count "${PREV}..HEAD" 2>/dev/null || echo 0)
              echo "Since \`$PREV\` (${COUNT} commits):"
              echo ""
              git log --oneline --no-merges "${PREV}..HEAD" | head -12 | while read -r line; do
                echo "- $line"
              done
              EXTRA=$(( COUNT > 12 ? COUNT - 12 : 0 ))
              if [ "$EXTRA" -gt 0 ]; then
                echo "- …and ${EXTRA} more"
              fi
            else
              echo "Recent commits:"
              echo ""
              git log --oneline --no-merges -8 | while read -r line; do
                echo "- $line"
              done
            fi
            echo ""
            echo "---"
            echo ""
            echo "**${{ github.ref_name }}** · \`${{ github.sha }}\`"
            echo ""
            echo "- **Windows:** portable \`.exe\`"
            echo "- **Android:** debug \`.apk\` (sideload)"
          } > /tmp/body.md

          echo "path=/tmp/body.md" >> "$GITHUB_OUTPUT"
          cat /tmp/body.md

      - name: Create release
        if: steps.debounce.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build.${{ github.run_number }}
          name: Rift Horizon v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          body_path: ${{ steps.notes.outputs.path }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debounce notice
        if: steps.debounce.outputs.skip == 'true'
        run: |
          echo "Build artifacts were produced, but release was skipped (another release within 10 minutes)."
          echo "Push again after 10 minutes, or use Actions → Run workflow to force a release."

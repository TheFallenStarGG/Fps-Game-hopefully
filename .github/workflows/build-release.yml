# Builds Windows EXE + Android APK and publishes both on one GitHub Release.
name: Build & Release

on:
  push:
    branches:
      - main
      - master
      - Update-4
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  APP_VERSION: '0.4.0'

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install & build
        working-directory: desktop
        run: |
          npm install
          npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Manual SDK install — more reliable than setup-android on current runners
      - name: Install Android SDK command-line tools
        run: |
          set -e
          ANDROID_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_ROOT/cmdline-tools"
          # zip contains a top-level "cmdline-tools" folder → rename to "latest"
          rm -rf "$ANDROID_ROOT/cmdline-tools/latest"
          mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install platform packages
        run: |
          set -e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed | head -40

      - name: Install Capacitor deps
        run: npm install

      - name: Stage web assets into www/
        run: |
          set -e
          rm -rf www
          mkdir -p www
          for item in index.html game.js favicon.png apple-touch-icon.png og.png lib assets; do
            if [ -e "$item" ]; then cp -a "$item" www/; fi
          done
          for f in *.js *.css *.wasm; do
            [ -f "$f" ] || continue
            case "$f" in package.json|package-lock.json) continue ;; esac
            cp -a "$f" www/ 2>/dev/null || true
          done
          test -f www/index.html
          echo "www contents:"
          find www -maxdepth 2 -type f | head -50

      - name: Add Android platform & sync
        run: |
          set -e
          npx cap add android
          npx cap sync android
          test -d android

      - name: Build debug APK
        working-directory: android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          set -e
          mkdir -p out
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "Found APK: $APK"
          test -n "$APK"
          cp "$APK" "out/RiftHorizon-${{ env.APP_VERSION }}-android-debug.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: List assets
        run: ls -la release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build.${{ github.run_number }}
          name: Rift Horizon v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          body: |
            Automated build from branch `${{ github.ref_name }}` (`${{ github.sha }}`).

            ### Downloads
            - **Windows:** portable `.exe` (no installer) — needs internet once for Three.js CDN
            - **Android:** debug `.apk` — enable “Install unknown apps” to sideload

            Web version stays on your Pages host.
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
